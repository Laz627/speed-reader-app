        muted: isDark ? 'rgba(255,255,255,0.45)' : isSepia ? 'rgba(91,70,54,0.5)' : 'rgba(0,0,0,0.45)',
        accent: isSepia ? '#c0392b' : '#ef4444',
        button: isDark ? 'rgba(255,255,255,0.08)' : isSepia ? 'rgba(91,70,54,0.08)' : 'rgba(0,0,0,0.06)',
        buttonBorder: isDark ? 'rgba(255,255,255,0.12)' : isSepia ? 'rgba(91,70,54,0.15)' : 'rgba(0,0,0,0.12)',
        dropZone: isDark ? 'rgba(239,68,68,0.1)' : isSepia ? 'rgba(192,57,43,0.08)' : 'rgba(239,68,68,0.08)',
      }), [themeMode]);
      
      const buttonStyle = useMemo(() => ({
        backgroundColor: theme.button,
        color: theme.text,
        border: '1px solid ' + theme.buttonBorder,
        borderRadius: '10px',
        padding: '12px 20px',
        fontSize: '14px',
        fontWeight: '500',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        cursor: 'pointer',
        transition: 'all 0.15s ease',
      }), [theme]);

      const demoText = "Welcome to Speed Reader. Drop an EPUB file anywhere on this screen to begin reading, or tap the Open button below.\n\nThe app will parse your book into chapters and let you navigate between them using the dropdown menu.\n\nUse the Play button to start reading at your chosen speed. The red letter marks the optimal recognition point for each word, helping your brain process text more efficiently.\n\nYour progress is automatically saved, so you can close the app and pick up right where you left off.\n\n\"This is example dialogue,\" she said, \"to demonstrate how quotes are now handled more smoothly.\"\n\nAdjust your reading speed with the WPM slider. Most people start around 300 words per minute and gradually increase with practice. Happy reading!";

      // ============================================================
      // APPLY THEME TO DOM
      // ============================================================
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', themeMode);
        document.body.style.backgroundColor = theme.bg;
        // Update meta theme color
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme.bg;
      }, [themeMode, theme.bg]);

      // ============================================================
      // SAVE PREFERENCES when they change
      // ============================================================
      useEffect(() => {
        savePreferences({
          theme: themeMode, pauses: pausesEnabled, haptic: hapticEnabled,
          wakeLock: wakeLockEnabled, smartPacing: smartPacingEnabled,
          paragraphPause: paragraphPauseMs,
          wpm, context: contextMode, voice: selectedVoice,
          dialogueVoice: dialogueVoice,
          dialogueSplit: dialogueSplitEnabled,
          listenSpeed, modelQuality, onboarded: true,
        });
      }, [themeMode, pausesEnabled, hapticEnabled, wakeLockEnabled, smartPacingEnabled, paragraphPauseMs, wpm, contextMode, selectedVoice, dialogueVoice, dialogueSplitEnabled, listenSpeed, modelQuality]);

      // ============================================================
      // PARSE CHAPTER TEXT INTO WORDS
      // Enhanced: builds paragraphRanges, splits hyphens, builds metadata
      // ============================================================
      useEffect(() => {
        let text = book ? book.chapters[chapterIndex]?.text : demoText;
        if (!text) return;
        
        // Step 0: Ensure paragraph markers exist for ALL text sources
        // extractTextFromHTML() adds them for EPUB content, but raw text
        // (demo, pasted) uses \n\n which needs the same treatment
        if (!text.includes(PARAGRAPH_MARKER)) {
          text = text.replace(/\n\s*\n\s*/g, ' ' + PARAGRAPH_MARKER + ' ');
          text = text.replace(/\n/g, ' ');
        }
        
        // Step 1: Split into raw tokens
        let tokens = text.trim().split(/\s+/).filter(w => w.length > 0);
        
        // Step 2: Split hyphenated compounds
        tokens = splitHyphenatedTokens(tokens);
        
        // Step 3: Build paragraph ranges (index ranges in final word array)
        const paraRanges = [];
        let paraStart = 0;
        let paraText = [];
        
        tokens.forEach((token, idx) => {
          if (token === PARAGRAPH_MARKER) {
            if (paraText.length > 0) {
              paraRanges.push({
                start: paraStart,
                end: idx - 1,
                text: paraText.join(' ').replace(/-\s/g, '-'), // rejoin hyphens for TTS
              });
            }
            paraText = [];
            paraStart = idx + 1;
          } else {
            paraText.push(token);
          }
        });
        // Last paragraph (no trailing marker)
        if (paraText.length > 0) {
          paraRanges.push({
            start: paraStart,
            end: tokens.length - 1,
            text: paraText.join(' ').replace(/-\s/g, '-'),
          });
        }
        
        // Step 4: Build word metadata for intelligent pacing
        const meta = buildWordMeta(tokens);
        applyRampUpPositions(meta, tokens);
        
        // Step 5: Build sentence indices
        const sentenceIndices = [];
        let sentenceStart = 0;
        tokens.forEach((word, idx) => {
          if (word === PARAGRAPH_MARKER || word === '\u2014' || word === '\u2013') return;
          if (/[.!?]["'"'\u201D\u2019]?$/.test(word)) {
            sentenceIndices.push({ start: sentenceStart, end: idx });
            sentenceStart = idx + 1;
          }
        });
        if (sentenceStart < tokens.length) {
          sentenceIndices.push({ start: sentenceStart, end: tokens.length - 1 });
        }
        
        setWords(tokens);
        setWordMeta(meta);
        setSentences(sentenceIndices);
        setParagraphRanges(paraRanges);
        setInDialogue(false);
      }, [book, chapterIndex]);

      // ============================================================
      // LOAD SAVED PROGRESS
      // ============================================================
      useEffect(() => {
        if (book) {
          const saved = loadProgress(book.title);
          if (saved) {
            setChapterIndex(saved.chapterIndex);
            setCurrentIndex(saved.wordIndex);
            if (saved.paragraphIndex) setListenParagraphIdx(saved.paragraphIndex);
          } else {
            setChapterIndex(0);
            setCurrentIndex(0);
          }
          // Load bookmarks
          setBookmarks(loadBookmarks(book.title));
          // Load per-chapter positions
          chapterPositionsRef.current = loadChapterPositions(book.title);
        }
      }, [book?.title]);

      // Save progress while playing (RSVP)
      useEffect(() => {
        if (book && isPlaying) {
          saveIntervalRef.current = setInterval(() => {
            saveProgress(book.title, chapterIndex, currentIndex, listenParagraphIdx);
          }, 5000);
          return () => clearInterval(saveIntervalRef.current);
        }
      }, [book, isPlaying, chapterIndex, currentIndex, listenParagraphIdx]);

      // Save on pause
      useEffect(() => {
        if (book && !isPlaying && !isListenPlaying) {
          saveProgress(book.title, chapterIndex, currentIndex, listenParagraphIdx);
        }
      }, [book, isPlaying, isListenPlaying, chapterIndex, currentIndex, listenParagraphIdx]);

      // ============================================================
      // WAKE LOCK: acquire when playing, release when stopped
      // ============================================================
      useEffect(() => {
        if ((isPlaying || isListenPlaying) && wakeLockEnabled) {
          requestWakeLock();
        } else {
          releaseWakeLock();
        }
        return () => releaseWakeLock();
      }, [isPlaying, isListenPlaying, wakeLockEnabled]);

      // ============================================================
      // SLEEP TIMER
      // ============================================================
      useEffect(() => {
        if (sleepMinutes > 0) {
          const end = Date.now() + sleepMinutes * 60000;
          setSleepEndTime(end);
          sleepTimerRef.current = setTimeout(() => {
            setIsPlaying(false);
            setIsListenPlaying(false);
            ttsManager.fullStop();
            setSleepMinutes(0);
            setSleepEndTime(null);
          }, sleepMinutes * 60000);
        } else {
          if (sleepTimerRef.current) clearTimeout(sleepTimerRef.current);
          setSleepEndTime(null);
        }
        return () => { if (sleepTimerRef.current) clearTimeout(sleepTimerRef.current); };
      }, [sleepMinutes]);

      // ============================================================
      // CHAPTER SPLASH
      // ============================================================
      const triggerChapterSplash = useCallback((chapterIdx, shouldAutoPlay) => {
        if (splashTimeoutRef.current) clearTimeout(splashTimeoutRef.current);
        setShowChapterSplash(true);
        setSplashFading(false);
        setPendingPlay(!!shouldAutoPlay);
        
        splashTimeoutRef.current = setTimeout(() => {
          setSplashFading(true);
          setTimeout(() => {
            setShowChapterSplash(false);
            setSplashFading(false);
            if (shouldAutoPlay) setIsPlaying(true);
          }, 500);
        }, 2500);
      }, []);

      useEffect(() => {
        return () => { if (splashTimeoutRef.current) clearTimeout(splashTimeoutRef.current); };
      }, []);

      // ============================================================
      // VIEWPORT RESIZE
      // ============================================================
      useEffect(() => {
        const handleResize = () => setIsMobileView(window.innerWidth < 640);
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // ============================================================
      // SERVICE WORKER UPDATE DETECTION
      // Listens for custom 'sw-update' event dispatched by SW registration
      // ============================================================
      useEffect(() => {
        const handleSwUpdate = () => setSwUpdateAvailable(true);
        window.addEventListener('sw-update', handleSwUpdate);
        return () => window.removeEventListener('sw-update', handleSwUpdate);
      }, []);

      // ============================================================
      // SENTENCE NAVIGATION
      // ============================================================
      const getCurrentSentence = useCallback(() => {
        for (let i = 0; i < sentences.length; i++) {
          if (currentIndex >= sentences[i].start && currentIndex <= sentences[i].end) return i;
        }
        return 0;
      }, [currentIndex, sentences]);
      
      // Get which paragraph a word index belongs to
      const getParagraphForWordIndex = useCallback((wordIdx) => {
        for (let i = 0; i < paragraphRanges.length; i++) {
          if (wordIdx >= paragraphRanges[i].start && wordIdx <= paragraphRanges[i].end) return i;
        }
        return 0;
      }, [paragraphRanges]);

      // ============================================================
      // DELAY CALCULATION (Enhanced with smart pacing)
      // ============================================================
      const getDelay = useCallback((word, idx) => {
        const baseDelay = 60000 / wpm;
        if (!pausesEnabled) return baseDelay;
        
        // Paragraph break = configurable pause
        if (word === PARAGRAPH_MARKER) return paragraphPauseMs;
        
        // Standalone em/en-dash (from split) = brief dramatic pause
        if (word === '\u2014') return baseDelay * 1.4;
        if (word === '\u2013') return baseDelay * 1.2;
        
        let multiplier = 1.0;
        const meta = wordMeta[idx];
        
        // === PUNCTUATION-BASED DELAYS ===
        
        // Em-dash within word
        if (word.includes('\u2014')) multiplier = Math.max(multiplier, 1.4);
        
        // Ellipsis
        if (word.includes('...') || word.includes('\u2026')) multiplier = Math.max(multiplier, 2.0);
        
        // Sentence-ending: . ! ?
        if (/[.!?]["'"'\u201D\u2019]?$/.test(word)) multiplier = Math.max(multiplier, 2.5);
        
        // Semicolon — strong clause break
        else if (/;$/.test(word)) multiplier = Math.max(multiplier, 1.8);
        
        // Colon — moderate pause for what follows
        else if (/:$/.test(word)) multiplier = Math.max(multiplier, 1.7);
        
        // Comma — light breath pause
        else if (/,$/.test(word)) multiplier = Math.max(multiplier, 1.5);
        
        // Opening quote — slight beat before dialogue
        if (LEADING_PUNCT.test(word) && /^["'"'\u201C\u2018\u00AB]/.test(word)) {
          multiplier = Math.max(multiplier, 1.2);
        }
        
        // === SMART PACING (if enabled) ===
        if (smartPacingEnabled && meta) {
          // Hyphen continuation — shorter delay to keep compound flowing
          if (meta.isHyphenPart) multiplier *= 0.7;
          
          // Sentence-initial words need extra processing time
          if (meta.isSentenceStart && multiplier < 2.0) multiplier = Math.max(multiplier, 1.15);
          
          // Proper nouns are harder to process
          if (meta.isProperNoun) multiplier = Math.max(multiplier, 1.1);
          
          // Numbers switch cognitive mode
          if (meta.isNumeric) multiplier = Math.max(multiplier, 1.2);
          
          // Common words process faster
          if (meta.isCommonWord && multiplier <= 1.0) multiplier *= 0.85;
          
          // Transition words signal clause shift
          if (meta.isTransitionWord) multiplier = Math.max(multiplier, 1.1);
          
          // Post-pause ramp-up: first 4 words after pause are slower
          if (meta.needsRampUp && meta.rampUpPosition < 4) {
            const rampMultiplier = [1.35, 1.2, 1.1, 1.0][meta.rampUpPosition] || 1.0;
            multiplier *= rampMultiplier;
          }
        }
        
        // === WORD LENGTH SCALING ===
        const len = word.replace(/[^a-zA-Z]/g, '').length;
        if (len > 10) multiplier = Math.max(multiplier, 1.15);
        else if (len > 7) multiplier = Math.max(multiplier, 1.08);
        
        return baseDelay * multiplier;
      }, [wpm, pausesEnabled, smartPacingEnabled, paragraphPauseMs, wordMeta]);

      // ============================================================
      // RSVP PLAYBACK LOOP
      // ============================================================
      useEffect(() => {
        if (mode !== 'rsvp') return;
        if (!isPlaying || words.length === 0 || showChapterSplash) return;
        
        const currentWord = words[currentIndex] || '';
        const delay = getDelay(currentWord, currentIndex);
        
        intervalRef.current = setTimeout(() => {
          // Update dialogue state
          if (currentWord !== PARAGRAPH_MARKER && currentWord !== '\u2014' && currentWord !== '\u2013') {
            setInDialogue(prev => updateDialogueState(currentWord, prev));
          }
          
          // Track words read for session stats
          if (currentWord !== PARAGRAPH_MARKER) {
            setSessionWordsRead(prev => prev + 1);
          }
          
          setCurrentIndex(prev => {
            if (prev >= words.length - 1) {
              // End of chapter — advance
              if (book && chapterIndex < book.chapters.length - 1) {
                // Save position for this chapter
                chapterPositionsRef.current[chapterIndex] = prev;
                if (book) saveChapterPositions(book.title, chapterPositionsRef.current);
                
                const nextChapter = chapterIndex + 1;
                setChapterIndex(nextChapter);
                setIsPlaying(false);
                triggerChapterSplash(nextChapter, true);
                return 0;
              }
              setIsPlaying(false);
              return prev;
            }
            return prev + 1;
          });
        }, delay);
        
        return () => { if (intervalRef.current) clearTimeout(intervalRef.current); };
      }, [mode, isPlaying, currentIndex, words, getDelay, book, chapterIndex, showChapterSplash, triggerChapterSplash]);

      // Reset index on chapter change
      useEffect(() => {
        if (book) {
          // Check if we have a saved position for this chapter
          const savedPos = chapterPositionsRef.current[chapterIndex];
          const globalSaved = loadProgress(book.title);
          if (globalSaved && globalSaved.chapterIndex === chapterIndex) {
            setCurrentIndex(globalSaved.wordIndex);
          } else if (savedPos !== undefined) {
            setCurrentIndex(savedPos);
          } else {
            setCurrentIndex(0);
          }
          setInDialogue(false);
        }
      }, [chapterIndex]);

      // ============================================================
      // LISTEN MODE PLAYBACK
      // ============================================================
      
      // Start/stop listen mode audio
      // Real-time sentence streaming with pre-gen on all platforms
      useEffect(() => {
        if (mode !== 'listen' || !isListenPlaying) return;
        if (modelStatus !== 'ready') return;
        if (paragraphRanges.length === 0) return;
        
        let cancelled = false;
        setListenAudioProgress(0);
        
        const advanceParagraph = () => {
          if (cancelled) return;
          setListenParagraphIdx(prev => {
            const next = prev + 1;
            if (next >= paragraphRanges.length) {
              if (book && chapterIndex < book.chapters.length - 1) {
                chapterPositionsRef.current[chapterIndex] = words.length - 1;
                if (book) saveChapterPositions(book.title, chapterPositionsRef.current);
                const nextCh = chapterIndex + 1;
                setChapterIndex(nextCh);
                setIsListenPlaying(false);
                triggerChapterSplash(nextCh, false);
                return 0;
              }
              setIsListenPlaying(false);
              return prev;
            }
            return next;
          });
        };
        
        async function play() {
          const para = paragraphRanges[listenParagraphIdx];
          if (!para || cancelled) {
            debugLog('[PLAY] Skipped: para=' + !!para + ', cancelled=' + cancelled);
            return;
          }
          
          debugLog('[PLAY] Para ' + (listenParagraphIdx + 1) + '/' + paragraphRanges.length + ': "' + para.text.substring(0, 60) + '..."');
          setIsGenerating(true);
          const paraKey = chapterIndex + ':' + listenParagraphIdx;
          
          try {
            // Check for pre-generated buffer first (instant playback)
            const pregenBuffer = await ttsManager.getPregen(paraKey);
            
            if (pregenBuffer) {
              debugLog('[TTS] ✓ Playing from pre-gen cache: para ' + (listenParagraphIdx + 1));
              setIsGenerating(false);
              ttsManager.usePregen(paraKey);
              await ttsManager.playBuffer(pregenBuffer, () => { advanceParagraph(); });
            } else {
              // Stream: generates sentence-by-sentence, plays each as it arrives
              console.log('[TTS] Streaming para ' + (listenParagraphIdx + 1) + '/' + paragraphRanges.length);
              await ttsManager.streamParagraph(
                para.text, selectedVoice, listenSpeed,
                () => { if (!cancelled) setIsGenerating(false); }, // onFirstAudio
                () => { advanceParagraph(); }, // onAllDone
              );
            }
            
            // Pre-generate next paragraph(s) while current plays.
            // Mobile (paragraph chunking): GPU is idle during playback, so
            // pre-gen of next paragraph runs uncontested. 1 ahead is enough.
            // Desktop (sentence streaming): 2 ahead for seamless transitions.
            const lookAhead = IS_MOBILE ? 1 : 2;
            for (let ahead = 1; ahead <= lookAhead; ahead++) {
              const futureIdx = listenParagraphIdx + ahead;
              if (futureIdx < paragraphRanges.length && !cancelled) {
                const futureKey = chapterIndex + ':' + futureIdx;
                ttsManager.pregenerate(futureKey, paragraphRanges[futureIdx].text, selectedVoice, listenSpeed);
              }
            }
            
            // Media session
            if (book) {
              updateMediaSession(book.title, book.chapters[chapterIndex]?.title, {
                play: () => setIsListenPlaying(true),
                pause: () => { setIsListenPlaying(false); ttsManager.pause(); },
                prev: () => setListenParagraphIdx(p => Math.max(0, p - 1)),
                next: () => setListenParagraphIdx(p => Math.min(paragraphRanges.length - 1, p + 1)),
              });
            }
          } catch(err) {
            console.error('[TTS] Error:', err);
            setIsGenerating(false);
            setIsListenPlaying(false);
          }
        }
        
        play();
        
        return () => {
          cancelled = true;
          // Stop current playback but PRESERVE pre-gen cache.
          // fullStop() calls clearPregen() which wipes the cache before
          // the next play() can read from it. Instead, just stop audio.
          ttsManager._cancelled = true;
          ttsManager.stop();
          ttsManager._queue = [];
          ttsManager._playing = false;
          ttsManager._allEnqueued = false;
          ttsManager._onDone = null;
          ttsManager._totalDur = 0;
          ttsManager._playedDur = 0;
          ttsManager._chunkStart = 0;
          ttsManager._estDur = 0;
        };
      }, [mode, isListenPlaying, listenParagraphIdx, modelStatus, paragraphRanges, selectedVoice, listenSpeed, book, chapterIndex, triggerChapterSplash]);
      
      // Track audio progress for paragraph highlight
      useEffect(() => {
        if (mode !== 'listen' || !isListenPlaying) {
          if (listenProgressRef.current) clearInterval(listenProgressRef.current);
          return;
        }
        
        listenProgressRef.current = setInterval(() => {
          setListenAudioProgress(ttsManager.getProgress());
        }, 100);
        
        return () => { if (listenProgressRef.current) clearInterval(listenProgressRef.current); };
      }, [mode, isListenPlaying]);

      // ============================================================
      // EVENT HANDLERS
      // ============================================================
      
      const handleDragOver = (ev) => { ev.preventDefault(); setIsDragging(true); };
      const handleDragLeave = (ev) => { ev.preventDefault(); setIsDragging(false); };
      const handleDrop = async (ev) => {
        ev.preventDefault();
        setIsDragging(false);
        const file = ev.dataTransfer.files[0];
        if (file) await loadFile(file);
      };
      const handleFileSelect = async (ev) => {
        const file = ev.target.files?.[0];
        if (file) await loadFile(file);
      };

      const loadFile = async (file) => {
        if (!file.name.toLowerCase().endsWith('.epub')) {
          setLoadError('Please select an EPUB file');
          return;
        }
        setIsLoading(true);
        setLoadError(null);
        setIsPlaying(false);
        setIsListenPlaying(false);
        ttsManager.fullStop();
        
        try {
          const parsed = await parseEPUB(file);
          setBook(parsed);
          setCurrentIndex(0);
          setInDialogue(false);
          setListenParagraphIdx(0);
          triggerChapterSplash(0, false);
        } catch (err) {
          console.error('EPUB parse error:', err);
          setLoadError(err.message || 'Failed to parse EPUB');
        } finally {
          setIsLoading(false);
        }
      };

      const handlePlayPause = () => {
        if (showChapterSplash) return;
        
        if (mode === 'listen') {
          debugLog('[UI] Play/Pause pressed, isPlaying=' + isListenPlaying + ', modelStatus=' + modelStatus);
          if (isListenPlaying) {
            setIsListenPlaying(false);
            ttsManager.pause();
          } else {
            // If model not loaded, start loading
            if (modelStatus !== 'ready') {
              debugLog('[UI] Model not ready, initiating load...');
              handleInitKokoro();
              return;
            }
            debugLog('[UI] Resuming playback');
            setIsListenPlaying(true);
            ttsManager.resume();
          }
          return;
        }
        
        // RSVP mode
        if (currentIndex >= words.length - 1 && !isPlaying) {
          setCurrentIndex(0);
          setInDialogue(false);
        }
        setIsPlaying(!isPlaying);
        if (hapticEnabled) haptic(10);
      };

      const handleReset = () => {
        setIsPlaying(false);
        setIsListenPlaying(false);
        ttsManager.fullStop();
        setCurrentIndex(0);
        setListenParagraphIdx(0);
        setInDialogue(false);
      };
      
      const handleInitKokoro = async () => {
        if (modelStatus === 'loading' || modelStatus === 'ready') return;
        
        debugLog('[INIT] Starting TTS init (backend: ' + ('local kokoro-js') + ')');
        setModelStatus('loading');
        setModelLoadProgress(0);
        
        try {
          ttsManager.onStatusChange = (status, progress) => {
            debugLog('[INIT] Status: ' + status + ', progress: ' + Math.round(progress) + '%');
            setModelStatus(status);
            setModelLoadProgress(progress);
          };
          
          await ttsManager.init((progress) => {
            setModelLoadProgress(progress);
          }, { dtype: modelQuality });
          
          debugLog('[INIT] ✓ TTS ready');
          setModelStatus('ready');
          // Auto-start playback after model loads
          setIsListenPlaying(true);
        } catch (err) {
          debugLog('[INIT] ❌ TTS init failed: ' + err.message);
          setModelStatus('error');
          setLoadError(('Failed to load voice model: ') + err.message);
        }
      };

      const handleModeToggle = () => {
        // Stop everything first
        setIsPlaying(false);
        setIsListenPlaying(false);
        ttsManager.fullStop();
        
        if (mode === 'rsvp') {
          // Switching to listen mode
          setMode('listen');
          // Map current word index to paragraph
          const paraIdx = getParagraphForWordIndex(currentIndex);
          setListenParagraphIdx(paraIdx);
        } else {
          // Switching to RSVP mode
          setMode('rsvp');
          // Map current paragraph to word index
          if (paragraphRanges[listenParagraphIdx]) {
            setCurrentIndex(paragraphRanges[listenParagraphIdx].start);
          }
        }
        if (hapticEnabled) haptic([10, 30, 10]);
      };

      // Navigation feedback
      const showNavFeedback = useCallback((direction) => {
        if (navFeedbackTimeoutRef.current) clearTimeout(navFeedbackTimeoutRef.current);
        if (navDirectionRef.current === direction) {
          navCountRef.current += 1;
        } else {
          navCountRef.current = 1;
          navDirectionRef.current = direction;
        }
        navFeedbackKey.current += 1;
        setNavFeedback({ direction, count: navCountRef.current, key: navFeedbackKey.current });
        navFeedbackTimeoutRef.current = setTimeout(() => {
          setNavFeedback(null);
          navCountRef.current = 0;
          navDirectionRef.current = null;
        }, 800);
      }, []);

      const handleBackSentence = useCallback(() => {
        if (mode === 'listen') {
          setListenParagraphIdx(p => Math.max(0, p - 1));
          setIsListenPlaying(false);
          ttsManager.fullStop();
          if (hapticEnabled) haptic(10);
          showNavFeedback('back');
          return;
        }
        const currentSentenceIdx = getCurrentSentence();
        const currentSentence = sentences[currentSentenceIdx];
        if (currentIndex > currentSentence?.start) {
          setCurrentIndex(currentSentence.start);
        } else if (currentSentenceIdx > 0) {
          setCurrentIndex(sentences[currentSentenceIdx - 1].start);
        }
        setInDialogue(false);
        if (hapticEnabled) haptic(10);
        showNavFeedback('back');
      }, [mode, getCurrentSentence, sentences, currentIndex, showNavFeedback, hapticEnabled]);

      const handleForwardSentence = useCallback(() => {
        if (mode === 'listen') {
          setListenParagraphIdx(p => Math.min(paragraphRanges.length - 1, p + 1));
          setIsListenPlaying(false);
          ttsManager.fullStop();
          if (hapticEnabled) haptic(10);
          showNavFeedback('forward');
          return;
        }
        const currentSentenceIdx = getCurrentSentence();
        if (currentSentenceIdx < sentences.length - 1) {
          setCurrentIndex(sentences[currentSentenceIdx + 1].start);
          if (hapticEnabled) haptic(10);
          showNavFeedback('forward');
        }
      }, [mode, getCurrentSentence, sentences, paragraphRanges, showNavFeedback, hapticEnabled]);

      const handleChapterChange = (newIndex) => {
        // Save current chapter position
        chapterPositionsRef.current[chapterIndex] = currentIndex;
        if (book) saveChapterPositions(book.title, chapterPositionsRef.current);
        
        setIsPlaying(false);
        setIsListenPlaying(false);
        ttsManager.fullStop();
        setChapterIndex(newIndex);
        setCurrentIndex(0);
        setListenParagraphIdx(0);
        setInDialogue(false);
        triggerChapterSplash(newIndex, false);
      };

      const handleSetText = () => {
        if (showTextInput && inputText.trim()) {
          setBook({
            title: 'Pasted Text',
            chapters: [{
              id: 'manual', title: 'Text', text: inputText.trim(),
              paragraphs: buildParagraphs(inputText.trim()), wordCount: inputText.trim().split(/\s+/).length, wordOffset: 0,
            }],
            totalWords: inputText.trim().split(/\s+/).length,
          });
          setChapterIndex(0);
          setCurrentIndex(0);
          setInDialogue(false);
          setShowTextInput(false);
          setInputText('');
        } else {
          setShowTextInput(!showTextInput);
          setInputText(book?.chapters[chapterIndex]?.text || demoText);
        }
      };

      const handleCloseBook = () => {
        setBook(null);
        setChapterIndex(0);
        setCurrentIndex(0);
        setIsPlaying(false);
        setIsListenPlaying(false);
        ttsManager.fullStop();
        setInDialogue(false);
        setShowChapterSplash(false);
        setListenParagraphIdx(0);
        clearMediaSession();
      };

      // Bookmark toggle at current position
      const toggleBookmark = useCallback(() => {
        if (!book) return;
        const existing = bookmarks.findIndex(b => b.chapterIndex === chapterIndex && Math.abs(b.wordIndex - currentIndex) < 5);
        let newBookmarks;
        if (existing >= 0) {
          newBookmarks = bookmarks.filter((_, i) => i !== existing);
        } else {
          newBookmarks = [...bookmarks, { chapterIndex, wordIndex: currentIndex, timestamp: Date.now() }];
        }
        setBookmarks(newBookmarks);
        saveBookmarks(book.title, newBookmarks);
        if (hapticEnabled) haptic([10, 50, 10]);
      }, [book, bookmarks, chapterIndex, currentIndex, hapticEnabled]);

      // Settings panel open/close with animation
      const openSettings = () => { setShowSettings(true); setSettingsClosing(false); };
      const closeSettings = () => {
        setSettingsClosing(true);
        setTimeout(() => { setShowSettings(false); setSettingsClosing(false); }, 250);
      };

      // ============================================================
      // REFS FOR HANDLERS (avoid stale closures)
      // ============================================================
      const handlersRef = useRef({});
      handlersRef.current = { handleBackSentence, handleForwardSentence, triggerChapterSplash, toggleBookmark };
      
      const stateRef = useRef({});
      stateRef.current = {
        book, chapterIndex, currentIndex, words, sentences, isPlaying,
        showChapterSplash, showTextInput, loadError, focusMode, contextMode,
        mode, isListenPlaying, paragraphRanges, listenParagraphIdx,
      };

      // ============================================================
      // KEYBOARD SHORTCUTS
      // ============================================================
      useEffect(() => {
        const handleKeyDown = (ev) => {
          if (ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'INPUT') return;
          const state = stateRef.current;
          const handlers = handlersRef.current;
          
          switch (ev.code) {
            case 'Space':
              ev.preventDefault();
              handlePlayPause();
              break;
            case 'ArrowLeft':
              ev.preventDefault();
              handlers.handleBackSentence?.();
              break;
            case 'ArrowRight':
              ev.preventDefault();
              handlers.handleForwardSentence?.();
              break;
            case 'ArrowUp':
              ev.preventDefault();
              if (state.book && state.chapterIndex > 0) handleChapterChange(state.chapterIndex - 1);
              break;
            case 'ArrowDown':
              ev.preventDefault();
              if (state.book && state.chapterIndex < state.book.chapters.length - 1) handleChapterChange(state.chapterIndex + 1);
              break;
            case 'KeyF':
              ev.preventDefault();
              setFocusMode(prev => !prev);
              break;
            case 'KeyC':
              ev.preventDefault();
              setContextMode(prev => !prev);
              break;
            case 'KeyB':
              ev.preventDefault();
              handlers.toggleBookmark?.();
              break;
            case 'KeyM':
              ev.preventDefault();
              handleModeToggle();
              break;
            case 'Escape':
              ev.preventDefault();
              if (showSettings) closeSettings();
              else setFocusMode(false);
              break;
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // ============================================================
      // TAP ZONES (mobile)
      // ============================================================
      const handleTapZone = useCallback((ev) => {
        if (ev.target.tagName === 'BUTTON' || ev.target.tagName === 'SELECT' || 
            ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') return;
        
        const state = stateRef.current;
        const handlers = handlersRef.current;
        if (state.showChapterSplash || state.showTextInput || state.loadError) return;
        
        const rect = ev.currentTarget.getBoundingClientRect();
        let clientX = ev.clientX;
        if (ev.touches?.length > 0) clientX = ev.touches[0].clientX;
        else if (ev.changedTouches?.length > 0) clientX = ev.changedTouches[0].clientX;
        
        const zone = (clientX - rect.left) / rect.width;
        
        if (zone < 0.33) handlers.handleBackSentence?.();
        else if (zone > 0.67) handlers.handleForwardSentence?.();
        else handlePlayPause();
      }, []);

      // ============================================================
      // SWIPE GESTURES (chapter navigation)
      // ============================================================
      const handleTouchStart = useCallback((ev) => {
        touchStartRef.current = { x: ev.touches[0].clientX, y: ev.touches[0].clientY, time: Date.now() };
      }, []);
      
      const handleTouchEnd = useCallback((ev) => {
        if (!touchStartRef.current) return;
        const dx = ev.changedTouches[0].clientX - touchStartRef.current.x;
        const dy = ev.changedTouches[0].clientY - touchStartRef.current.y;
        const dt = Date.now() - touchStartRef.current.time;
        touchStartRef.current = null;
        
        // Must be a quick, primarily vertical swipe
        if (dt > 500) return;
        if (Math.abs(dx) > Math.abs(dy)) return; // horizontal = not a chapter swipe
        if (Math.abs(dy) < 80) return; // too short
        
        const state = stateRef.current;
        if (!state.book) return;
        
        if (dy < 0 && state.chapterIndex < state.book.chapters.length - 1) {
          // Swipe up = next chapter
          handleChapterChange(state.chapterIndex + 1);
          if (hapticEnabled) haptic([10, 50, 10]);
        } else if (dy > 0 && state.chapterIndex > 0) {
          // Swipe down = prev chapter
          handleChapterChange(state.chapterIndex - 1);
          if (hapticEnabled) haptic([10, 50, 10]);
        }
      }, [hapticEnabled]);

      // ============================================================
      // FONT SCALING for long words
      // ============================================================
      const calculateFontScale = (word) => {
        if (!word || word === PARAGRAPH_MARKER) return 1;
        const vw = window.innerWidth;
        const COMFORTABLE = Math.min(14, Math.max(7, Math.floor(vw / 85)));
        const charCount = word.length;
        if (charCount <= COMFORTABLE) return 1;
        return Math.max(0.35, 1 - ((charCount - COMFORTABLE) * 0.055));
      };

      // ============================================================
      // RENDER: Single word with ORP highlighting
      // (Unified — used for both main word and context words)
      // ============================================================
      const renderSingleWord = (word, options = {}) => {
        const { isContext = false, fontScale = 1, contextScale = 0.4 } = options;
        
        if (!word || word === PARAGRAPH_MARKER || word === '\u2014' || word === '\u2013') {
          if (isContext) return null;
          return e('span', { style: { opacity: 0.2, fontSize: 'clamp(1.5rem, 8vw, 3rem)' } },
            word === PARAGRAPH_MARKER ? '\u00B6' : '\u2014');
        }
        
        const { leadingPunct, coreWord, trailingPunct } = processWordForDisplay(word);
        const orpPos = getORPPositionInWord(coreWord);
        const effectiveScale = isContext ? contextScale : fontScale;
        const baseFontSize = 'calc(clamp(2.5rem, 12vw, 4.5rem) * ' + effectiveScale + ')';
        
        const punctOpacity = isContext ? 0.15 : 0.35;
        const punctStyle = {
          color: isDark ? 'rgba(255,255,255,' + punctOpacity + ')' : isSepia ? 'rgba(91,70,54,' + punctOpacity + ')' : 'rgba(0,0,0,' + punctOpacity + ')',
          fontWeight: '300',
        };
        
        const textOpacity = isContext ? 0.25 : 1;
        const textColor = isDark
          ? 'rgba(255,255,255,' + textOpacity + ')'
          : isSepia ? 'rgba(91,70,54,' + textOpacity + ')' : 'rgba(0,0,0,' + textOpacity + ')';
        
        return e('span', {
          style: {
            fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
            fontSize: baseFontSize,
            fontWeight: '400',
            letterSpacing: '0.02em',
            display: 'inline-flex',
            alignItems: 'baseline',
            justifyContent: 'center',
            whiteSpace: 'nowrap',
          }
        }, [
          leadingPunct && e('span', { key: 'l', style: { ...punctStyle, fontSize: '0.75em', marginRight: '0.05em' } }, leadingPunct),
          e('span', { key: 'c' },
            coreWord.split('').map((char, idx) =>
              e('span', {
                key: idx,
                style: {
                  color: (!isContext && idx === orpPos) ? theme.accent : textColor,
                  fontWeight: (!isContext && idx === orpPos) ? '500' : '400',
                }
              }, char)
            )
          ),
          trailingPunct && e('span', { key: 't', style: { ...punctStyle, fontSize: '0.85em', marginLeft: '0.02em' } }, trailingPunct),
        ]);
      };

      // ============================================================
      // RENDER: RSVP word display (with optional context)
      // ============================================================
      const renderWord = () => {
        const word = words[currentIndex] || '';
        if (!word) return e('span', { style: { opacity: 0.3 } }, '\u2014');
        
        if (word === PARAGRAPH_MARKER || word === '\u2014' || word === '\u2013') {
          return e('span', { style: { opacity: 0.2, fontSize: 'clamp(1.5rem, 8vw, 3rem)' } },
            word === PARAGRAPH_MARKER ? '\u00B6' : '\u2014');
        }
        
        const fontScale = calculateFontScale(word);
        
        if (!contextMode) {
          return renderSingleWord(word, { isContext: false, fontScale });
        }
        
        // Context mode: show prev / MAIN / next
        let prevWord = null, nextWord = null;
        for (let i = currentIndex - 1; i >= 0; i--) {
          if (words[i] !== PARAGRAPH_MARKER && words[i] !== '\u2014' && words[i] !== '\u2013') { prevWord = words[i]; break; }
        }
        for (let i = currentIndex + 1; i < words.length; i++) {
          if (words[i] !== PARAGRAPH_MARKER && words[i] !== '\u2014' && words[i] !== '\u2013') { nextWord = words[i]; break; }
        }
        
        const ctxScale = isMobileView ? 0.42 : 0.38;
        
        if (isMobileView) {
          return e('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 'clamp(0.25rem, 2vh, 0.75rem)', width: '100%', maxWidth: '95vw' } }, [
            e('div', { key: 'p', style: { height: 'clamp(1.5rem, 6vh, 2.5rem)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center' } },
              prevWord ? renderSingleWord(prevWord, { isContext: true, contextScale: ctxScale }) : null),
            e('div', { key: 'm', style: { display: 'flex', alignItems: 'center', justifyContent: 'center' } },
              renderSingleWord(word, { isContext: false, fontScale })),
            e('div', { key: 'n', style: { height: 'clamp(1.5rem, 6vh, 2.5rem)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center' } },
              nextWord ? renderSingleWord(nextWord, { isContext: true, contextScale: ctxScale }) : null),
          ]);
        }
        
        return e('div', { style: { display: 'flex', alignItems: 'baseline', justifyContent: 'center', gap: 'clamp(0.75rem, 3vw, 2rem)', width: '100%', maxWidth: '95vw' } }, [
          e('span', { key: 'p', style: { flex: '0 1 auto', maxWidth: '22%', overflow: 'hidden' } },
            prevWord ? renderSingleWord(prevWord, { isContext: true, contextScale: ctxScale }) : null),
          e('span', { key: 'm', style: { flex: '0 1 auto', maxWidth: '50%' } },
            renderSingleWord(word, { isContext: false, fontScale })),
          e('span', { key: 'n', style: { flex: '0 1 auto', maxWidth: '22%', overflow: 'hidden' } },
            nextWord ? renderSingleWord(nextWord, { isContext: true, contextScale: ctxScale }) : null),
        ]);
      };

      // ============================================================
      // RENDER: Listen mode paragraph view
      // ============================================================
      const renderListenView = () => {
        const para = paragraphRanges[listenParagraphIdx];
        if (!para) return e('div', { style: { color: theme.muted, textAlign: 'center' } }, 'No paragraph available');
        
        return e('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', width: '100%', height: '100%', overflow: 'auto', padding: '1rem' } }, [
          // Paragraph number indicator
          e('div', { key: 'para-num', style: { fontSize: '0.6875rem', fontWeight: '600', textTransform: 'uppercase', letterSpacing: '0.1em', color: theme.muted, marginBottom: '0.75rem' } },
            '\u00B6 ' + (listenParagraphIdx + 1) + ' / ' + paragraphRanges.length
            + (isGenerating ? ' \u2022 Generating...' : isListenPlaying ? ' \u2022 Playing' : '')),
          
          // The paragraph text with estimated word-level highlighting
          // We split text into words and highlight based on audio progress percentage
          e('div', {
            key: 'para-text',
            className: 'listen-paragraph',
            style: {
              fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
              color: theme.text,
            }
          }, (() => {
            const paraWords = para.text.split(/\s+/);
            const highlightIdx = Math.floor(listenAudioProgress * paraWords.length);
            return paraWords.map((w, i) =>
              e('span', {
                key: i,
                className: 'listen-word' + (isListenPlaying && i === highlightIdx ? ' active' : ''),
                style: {
                  opacity: isListenPlaying ? (i < highlightIdx ? 0.5 : i === highlightIdx ? 1 : 0.85) : 1,
                  transition: 'opacity 0.15s, background-color 0.1s',
                  fontWeight: isListenPlaying && i === highlightIdx ? '600' : '400',
                }
              }, w + (i < paraWords.length - 1 ? ' ' : ''))
            );
          })()),
          
          // Audio progress bar
          (isListenPlaying || listenAudioProgress > 0) && e('div', {
            key: 'audio-progress',
            style: { width: '80%', maxWidth: '20rem', height: '3px', borderRadius: '2px', background: theme.cardBorder, marginTop: '1rem', overflow: 'hidden' }
          }, e('div', { style: { height: '100%', width: (listenAudioProgress * 100) + '%', background: theme.accent, transition: 'width 0.15s' } })),
        ]);
      };

      // ============================================================
      // RENDER: Chapter splash
      // ============================================================
      const renderChapterSplash = () => {
        if (!showChapterSplash || !book) return null;
        const chapter = book.chapters[chapterIndex];
        if (!chapter) return null;
        
        return e('div', {
          key: 'splash',
          className: 'chapter-splash ' + (splashFading ? 'fading' : ''),
          style: {
            position: 'fixed', inset: 0, zIndex: 100,
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            backgroundColor: isDark ? 'rgba(10,10,10,0.95)' : isSepia ? 'rgba(244,236,216,0.95)' : 'rgba(250,250,250,0.95)',
            backdropFilter: 'blur(8px)',
          }
        }, [
          e('div', { key: 'num', style: { fontSize: '0.875rem', fontWeight: '500', textTransform: 'uppercase', letterSpacing: '0.15em', color: theme.accent, marginBottom: '1rem' } },
            'Chapter ' + (chapterIndex + 1) + ' of ' + book.chapters.length),
          e('div', { key: 'title', style: { fontSize: 'clamp(1.5rem, 6vw, 2.5rem)', fontWeight: '600', textAlign: 'center', padding: '0 2rem', color: theme.text, maxWidth: '600px', lineHeight: '1.3' } }, chapter.title),
          e('div', { key: 'sub', style: { marginTop: '1.5rem', fontSize: '0.875rem', color: theme.muted } },
            pendingPlay ? 'Starting in a moment...' : 'Tap Play to begin'),
        ]);
      };

      // ============================================================
      // RENDER: Dialogue indicator
      // ============================================================
      const renderDialogueIndicator = () => {
        if (!inDialogue || showChapterSplash || mode !== 'rsvp') return null;
        return e('div', {
          key: 'dialogue',
          style: {
            position: 'absolute', top: '1rem', left: '50%', transform: 'translateX(-50%)',
            display: 'flex', alignItems: 'center', gap: '0.5rem',
            padding: '0.375rem 0.75rem', borderRadius: '999px',
            backgroundColor: isDark ? 'rgba(239,68,68,0.15)' : 'rgba(239,68,68,0.1)',
            border: '1px solid ' + (isDark ? 'rgba(239,68,68,0.3)' : 'rgba(239,68,68,0.2)'),
            animation: 'subtlePulse 3s ease-in-out infinite',
          }
        }, [
          e('span', { key: 'i', style: { fontSize: '0.875rem', opacity: 0.8 } }, '\u201C'),
          e('span', { key: 't', style: { fontSize: '0.6875rem', fontWeight: '500', textTransform: 'uppercase', letterSpacing: '0.05em', color: isDark ? 'rgba(239,68,68,0.9)' : 'rgba(239,68,68,0.8)' } }, 'Dialogue'),
        ]);
      };

      // ============================================================
      // RENDER: Navigation feedback
      // ============================================================
      const renderNavFeedback = () => {
        if (!navFeedback) return null;
        const isBack = navFeedback.direction === 'back';
        return e('div', {
          key: 'nav-' + navFeedback.key,
          style: {
            position: 'absolute', bottom: focusMode ? '5rem' : '1rem', left: '50%', transform: 'translateX(-50%)',
            display: 'flex', alignItems: 'center', gap: '0.5rem',
            padding: '0.625rem 1.25rem', borderRadius: '999px',
            backgroundColor: isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)',
            border: '2px solid ' + (isDark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.2)'),
            animation: (isBack ? 'navFeedbackSlideRight' : 'navFeedbackSlideLeft') + ' 0.15s ease-out',
            pointerEvents: 'none', zIndex: 100,
          }
        }, [
          e('span', { key: 'a', style: { fontSize: '1.5rem', fontWeight: '700', color: theme.text } }, isBack ? '\u2190' : '\u2192'),
          e('span', { key: 'c', style: { fontSize: '1.375rem', fontWeight: '800', color: theme.accent } }, (isBack ? '-' : '+') + navFeedback.count),
        ]);
      };

      // ============================================================
      // RENDER: Focus mode exit
      // ============================================================
      const renderFocusModeExit = () => {
        if (!focusMode) return null;
        return e('button', {
          key: 'focus-exit',
          onClick: (ev) => { ev.preventDefault(); ev.stopPropagation(); setFocusMode(false); },
          style: {
            position: 'absolute', top: '1rem', right: '1rem',
            width: '48px', height: '48px', borderRadius: '50%',
            backgroundColor: isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)',
            border: '2px solid ' + (isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.3)'),
            color: isDark ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.7)',
            fontSize: '1.5rem', cursor: 'pointer', display: 'flex',
            alignItems: 'center', justifyContent: 'center', zIndex: 250, outline: 'none',
          }
        }, '\u2715');
      };

      // ============================================================
      // RENDER: Model loading overlay
      // ============================================================
      const renderModelLoading = () => {
        if (modelStatus !== 'loading') return null;
        return e('div', { className: 'model-loading-overlay' }, [
          e('div', { key: 'spin', style: { width: '40px', height: '40px', border: '3px solid rgba(255,255,255,0.1)', borderTopColor: '#ef4444', borderRadius: '50%', animation: 'spin 1s linear infinite' } }),
          e('div', { key: 'title', style: { fontSize: '1.125rem', fontWeight: '600', color: '#fff' } }, 'Loading Voice Model (' + modelQuality + ')'),
          e('div', { key: 'sub', style: { fontSize: '0.8125rem', color: 'rgba(255,255,255,0.5)' } },
            modelLoadProgress > 0 ? (Math.round(modelLoadProgress) + '%') : 'Initializing...'),
          e('div', { key: 'bar', className: 'model-progress-bar' },
            e('div', { className: 'model-progress-fill', style: { width: modelLoadProgress + '%' } })),
          e('div', { key: 'note', style: { fontSize: '0.6875rem', color: 'rgba(255,255,255,0.3)', marginTop: '0.5rem' } }, 'One-time download \u2022 Cached for offline use'),
        ]);
      };


      // ============================================================
      // RENDER: Settings panel
      // ============================================================
      const renderSettings = () => {
        if (!showSettings) return null;
        
        return [
          e('div', { key: 'overlay', className: 'settings-overlay', onClick: closeSettings }),
          e('div', { key: 'panel', className: 'settings-panel ' + (settingsClosing ? 'closing' : '') }, [
            // Handle bar
            e('div', { key: 'handle', style: { width: '2rem', height: '4px', borderRadius: '2px', background: theme.muted, margin: '0 auto 1rem', opacity: 0.5 } }),
            
            // Voice settings
            e('div', { key: 'voice', className: 'settings-section' }, [
              e('div', { key: 'l', className: 'settings-label' }, 'Voices (Listen Mode)'),
              e('div', { key: 'narrator', className: 'settings-row' }, [
                e('span', { key: 'rl', className: 'settings-row-label' }, 'Voice'),
                e('select', {
                  key: 'sel',
                  className: 'settings-select',
                  value: selectedVoice,
                  onChange: (ev) => setSelectedVoice(ev.target.value),
                }, KOKORO_VOICES.map(v =>
                  e('option', { key: v.id, value: v.id }, v.name + ' (' + v.rating + ') ' + (v.gender === 'F' ? '\u2640' : '\u2642'))
                )),
              ]),
              e('div', { key: 'splitToggle', className: 'settings-row' }, [
                e('span', { key: 'rl', className: 'settings-row-label' }, 'Dialogue Voice Splitting'),
                e('button', { key: 'tog', className: 'settings-toggle ' + (dialogueSplitEnabled ? 'active' : ''), onClick: () => setDialogueSplitEnabled(!dialogueSplitEnabled) }),
              ]),
              dialogueSplitEnabled && e('div', { key: 'dialogue', className: 'settings-row' }, [
                e('span', { key: 'rl', className: 'settings-row-label' }, 'Dialogue Voice'),
                e('select', {
                  key: 'sel',
                  className: 'settings-select',
                  value: dialogueVoice,
                  onChange: (ev) => setDialogueVoice(ev.target.value),
                }, KOKORO_VOICES.map(v =>
                  e('option', { key: v.id, value: v.id }, v.name + ' (' + v.rating + ') ' + (v.gender === 'F' ? '\u2640' : '\u2642'))
                )),
              ]),
              dialogueSplitEnabled && e('div', { key: 'voicenote', style: { fontSize: '0.6875rem', color: theme.muted, marginTop: '0.25rem' } },
                'Slower generation — uses separate voice for quoted text'),
              e('div', { key: 'speed', className: 'settings-row' }, [
                e('span', { key: 'sl', className: 'settings-row-label' }, 'Listen Speed: ' + listenSpeed.toFixed(1) + 'x'),
                e('input', {
                  key: 'sr', type: 'range', min: 0.5, max: 2.0, step: 0.1,
                  value: listenSpeed,
                  onChange: (ev) => setListenSpeed(Number(ev.target.value)),
                  style: { width: '8rem', height: '4px', borderRadius: '2px', backgroundColor: theme.cardBorder, cursor: 'pointer' },
                }),
              ]),

      navigator.serviceWorker.register('sw.js').then((reg) => {
        debugLog('[SW] Registered, scope: ' + reg.scope);
        reg.addEventListener('updatefound', () => {
          debugLog('[SW] Update found, installing...');
          const newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              debugLog('[SW] New worker state: ' + newWorker.state);
              if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                // New version available — show banner (dispatched to React via custom event)
                window.dispatchEvent(new Event('sw-update'));
              }
            });
          }
        });
      }).catch((err) => { debugLog('[SW] Registration failed: ' + err.message); });
    }
  </script>
</body>
</html>
